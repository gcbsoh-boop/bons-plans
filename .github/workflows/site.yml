name: Mise a jour du site

on:
  schedule:
    - cron: "17 * * * *"   # toutes les heures
  workflow_dispatch:        # bouton "Run workflow" pour lancer a la main
  push:
    branches: [master, main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Garde les dernieres offres d'une heure a l'autre (si une source bloque)
      - uses: actions/cache@v4
        with:
          path: cache.json
          key: offres-${{ github.run_id }}
          restore-keys: offres-

      - name: Collecte des bons plans
        run: node bons-plans.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
