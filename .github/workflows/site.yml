name: Mise a jour du site

on:
  schedule:
    - cron: "17 * * * *"   # toutes les heures
  workflow_dispatch:        # bouton "Run workflow" pour lancer a la main
  push:
    branches: [master, main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Garde les dernieres offres d'une heure a l'autre (si une source bloque)
      - uses: actions/cache@v4
        with:
          path: cache.json
          key: offres-${{ github.run_id }}
          restore-keys: offres-

      # Recupere l'historique des prix depuis la branche "donnees" (s'il existe)
      - name: Restaurer l'historique
        run: |
          if git ls-remote --exit-code --heads origin donnees >/dev/null 2>&1; then
            git fetch --depth=1 origin donnees
            git show FETCH_HEAD:historique.json > historique.json || rm -f historique.json
          fi

      - name: Collecte des bons plans
        run: node bons-plans.js

      # Sauvegarde l'historique dans la branche "donnees" (une seule fiche, sans le reste du projet)
      - name: Sauvegarder l'historique
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f historique.json ]; then
            tmp=$(mktemp -d)
            cp historique.json "$tmp/"
            cd "$tmp"
            git init -q -b donnees
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add historique.json
            git commit -q -m "Mise a jour de l'historique des prix"
            git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" donnees
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
