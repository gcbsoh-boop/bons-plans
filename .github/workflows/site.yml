name: Mise a jour du site

on:
  schedule:
    - cron: "17 * * * *"   # toutes les heures
  workflow_dispatch:        # bouton "Run workflow" pour lancer a la main
  push:
    branches: [master, main]

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Garde les dernieres offres d'une heure a l'autre (si une source bloque)
      - uses: actions/cache@v4
        with:
          path: cache.json
          key: offres-${{ github.run_id }}
          restore-keys: offres-

      # Recupere l'historique des prix depuis la branche "donnees" (lecture publique)
      - name: Restaurer l'historique
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" donnees >/dev/null 2>&1; then
            git fetch --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" donnees
            git show FETCH_HEAD:historique.json > historique.json || rm -f historique.json
          fi

      - name: Collecte des bons plans
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}            # public
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}  # clé publique (anon)
        run: node bons-plans.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/upload-artifact@v4
        with:
          name: donnees
          path: |
            historique.json
            nouveaux.json
          if-no-files-found: ignore

  donnees:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: donnees

      # Sauvegarde l'historique dans la branche "donnees" (une seule fiche, sans le reste du projet)
      - name: Sauvegarder l'historique
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f historique.json ]; then
            tmp=$(mktemp -d)
            cp historique.json "$tmp/"
            cd "$tmp"
            git init -q -b donnees
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add historique.json
            git commit -q -m "Mise a jour de l'historique des prix"
            git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" donnees
          fi

  alertes:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: donnees

      # Alertes ntfy (s'arrete sans bruit si la clé secrète manque)
      - name: Alertes personnalisees
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}  # secrete : jamais dans le site
        run: node alertes.js

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
